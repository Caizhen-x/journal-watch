name: Daily poll

on:
  schedule:
    - cron: '0 6 * * *'  # 06:00 UTC daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Fetch and classify
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m src.run

      - name: Commit updated DB
        run: |
          git config user.name "journal-watch-bot"
          git config user.email "actions@github.com"
          git add data/papers.db
          if git diff --staged --quiet; then
            echo "No DB changes."
          else
            git commit -m "chore: daily poll $(date -u +%Y-%m-%d)"
            git push
          fi
