name: Weekly digest

# Schedule disabled — email digest is not currently enabled.
# To re-enable end-to-end, you need ALL of:
#   1. Uncomment the `schedule:` block below
#   2. Set the repository variable ENABLE_DIGEST = "true" (Settings → Variables)
#   3. Set GHA secrets: GMAIL_SENDER_ADDRESS, GMAIL_APP_PASSWORD, SUBSCRIBERS_CSV_URL,
#      DIGEST_LOG_HASH_KEY (see SETUP.md).
# The Send-digests step is gated on ENABLE_DIGEST so even manual dispatch
# can't accidentally send email until the variable is set.
on:
  # schedule:
  #   - cron: '0 7 * * 1'  # Monday 07:00 UTC (08/09 in Berlin depending on DST)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Send digests
        if: vars.ENABLE_DIGEST == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUBSCRIBERS_CSV_URL: ${{ secrets.SUBSCRIBERS_CSV_URL }}
          GMAIL_SENDER_ADDRESS: ${{ secrets.GMAIL_SENDER_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DIGEST_LOG_HASH_KEY: ${{ secrets.DIGEST_LOG_HASH_KEY }}
        run: python -m src.digest

      - name: Digest disabled notice
        if: vars.ENABLE_DIGEST != 'true'
        run: |
          echo "ENABLE_DIGEST repo variable is not 'true' — skipping digest send."
          echo "To enable: Settings → Secrets and variables → Actions → Variables → New repository variable"
          echo "  Name: ENABLE_DIGEST   Value: true"

      - name: Commit digest log
        run: |
          git config user.name "journal-watch-bot"
          git config user.email "actions@github.com"
          git add data/papers.db
          if git diff --staged --quiet; then
            echo "No log changes."
          else
            git commit -m "chore: weekly digest sent $(date -u +%Y-%m-%d)"
            git push
          fi
