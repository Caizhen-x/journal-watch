name: Weekly digest

on:
  schedule:
    - cron: '0 7 * * 1'  # Monday 07:00 UTC (08/09 in Berlin depending on DST)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Send digests
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUBSCRIBERS_CSV_URL: ${{ secrets.SUBSCRIBERS_CSV_URL }}
          GMAIL_SENDER_ADDRESS: ${{ secrets.GMAIL_SENDER_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python -m src.digest

      - name: Commit digest log
        run: |
          git config user.name "journal-watch-bot"
          git config user.email "actions@github.com"
          git add data/papers.db
          if git diff --staged --quiet; then
            echo "No log changes."
          else
            git commit -m "chore: weekly digest sent $(date -u +%Y-%m-%d)"
            git push
          fi
